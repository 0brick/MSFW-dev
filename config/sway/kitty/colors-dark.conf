# i3-apple · kitty-Farben im Dunkelmodus (Apple-Systemfarben)
# Wird über theme.conf geladen – passend zu Menüleiste und Popups.

foreground            #e5e5e7
background            #1c1c1e
selection_foreground  #ffffff
selection_background  #3f638b
cursor                #e5e5e7
cursor_text_color     #1c1c1e
cursor_trail_color    none
url_color             #409cff

# Tabs: aktiver Tab hebt sich als helle Pille ab, die Leiste geht im Hintergrund auf
tab_bar_background      #1c1c1e
active_tab_background   #3a3a3c
active_tab_foreground   #f5f5f7
inactive_tab_background #242426
inactive_tab_foreground #8e8e93

# Trennlinien zwischen Bereichen
active_border_color   #48484a
inactive_border_color #2c2c2e
bell_border_color     #ff9f0a

