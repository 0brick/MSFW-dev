# ═══════════════════════════════════════════════════════════════════
#  i3-apple (Sway) · kitty im Stil des macOS-Terminals
#  Nur für die Sitzung „Sway (i3-apple)“ (KITTY_CONFIG_DIRECTORY aus
#  env-sway.sh) – ~/.config/kitty bleibt für andere Desktops unberührt.
#  Farben: colors-dark.conf / colors-light.conf. Welche gilt, steht in
#  theme.conf – die schreibt theme.sh beim Umschalten (Super+Shift+M)
#  und lädt offene kitty-Fenster neu.
#  Eigene Wünsche gehören in ~/.config/sway/kitty/eigene.conf: Sie wird
#  zuletzt geladen, der Installer legt sie nie an und überschreibt sie nie.
# ═══════════════════════════════════════════════════════════════════

# ── Schrift ──────────────────────────────────────────────────────────
# SF Mono, falls installiert (sonst setzt der Installer JetBrains Mono)
font_family      SF Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height 118%
disable_ligatures cursor

# ── Fenster ──────────────────────────────────────────────────────────
# Glas-Hintergrund: Die Unschärfe dahinter macht SwayFX (blur enable),
# die runden Ecken ebenfalls (corner_radius) – darum keine Rahmen.
background_opacity 0.86
dynamic_background_opacity yes
window_padding_width 10 16
hide_window_decorations yes
confirm_os_window_close 0
placement_strategy center

# Mehrere Bereiche in einem Fenster: dünne, ruhige Trennlinien,
# inaktive Bereiche treten leicht zurück
draw_minimal_borders yes
window_border_width 1px
inactive_text_alpha 0.78

# ── Zeiger & Verhalten ───────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.6
# Der Installer macht daraus bei kitty ≥ 0.36 ein weiches Ein-/Ausblenden
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0
mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart
scrollback_lines 10000
url_style curly
detect_urls yes
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# Flüssiger: kürzere Wartezeit zwischen Eingabe und Bildaufbau
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Zeigerspur: Der Zeiger gleitet bei großen Sprüngen sichtbar zum Ziel
# (kitty ≥ 0.37 – ältere Versionen überspringen diese Zeilen still)
cursor_trail 3
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 3

# ── Tabs (oben, abgerundet wie in Terminal.app) ─────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_margin_width 6.0
tab_bar_margin_height 6.0 2.0
tab_title_template "{index}  {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Tastenkürzel (zusätzlich zu den kitty-Standards) ────────────────
# Neuer Tab / neues Fenster öffnet im aktuellen Ordner
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd

# ── Farben ───────────────────────────────────────────────────────────
# Dunkel als Grundlage; theme.conf wählt die Palette zum Erscheinungsbild.
# globinclude: fehlt die Datei, wird die Zeile still übersprungen.
include colors-dark.conf
globinclude theme.conf

# ── Eigene Einstellungen (zuletzt, überschreiben alles oben) ────────
globinclude eigene.conf
