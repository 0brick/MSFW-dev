# i3-apple · Effekte für SwayFX
# Wird beim Sitzungsstart (env-sway.sh) und vom Installer nach ~/.config/sway/fx.conf
# kopiert, wenn SwayFX läuft – bei normalem Sway bleibt fx.conf leer.
# Jeder Befehl in einer eigenen Zeile: toggles.sh spielt die Datei zeilenweise ein.
# Mit normalem Sway bleibt fx.conf leer – diese Befehle kennt nur SwayFX.

# ── Abgerundete Ecken (wie macOS-Fenster) ────────────────────────────
# Immer rund, auch bei nur einem Fenster auf der Arbeitsfläche
# (smart_corner_radius würde die Ecken dann abschalten).
# Der Wert passt zu den Fenstern von i3-apple (Hintergrund-Auswahl: 12 px).
corner_radius 12
smart_corner_radius off

# ── Schatten (macOS-Fenster „schweben“) ──────────────────────────────
shadows enable
shadows_on_csd disable
shadow_blur_radius 30
shadow_color #00000066
shadow_offset 0 10

# ── Unschärfe hinter transparenten Flächen (Terminal, Leiste, Popups) ─
blur enable
blur_xray disable
blur_passes 3
blur_radius 5

# ── Inaktive Fenster leicht abdunkeln (Fokus ohne Rahmen erkennbar) ──
default_dim_inactive 0.06
dim_inactive_colors.unfocused #000000FF
dim_inactive_colors.urgent #900000FF

# ── Menüleiste, Popups, Spotlight und Mitteilungen (Layer-Shell) ─────
# corner_radius der Popups = border-radius von .popup in eww/eww.scss
layer_effects "eww-bar" blur enable; shadows disable
layer_effects "eww-popup" blur enable; shadows enable; corner_radius 14
layer_effects "rofi" blur enable; shadows enable; corner_radius 16
layer_effects "notifications" blur enable; shadows enable; corner_radius 12
