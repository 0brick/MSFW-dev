# i3-apple · Animationen (SwayFX ab 0.6)
# Fenster öffnen/schließen, verschieben/Größe ändern und der Wechsel der
# Arbeitsfläche werden animiert. Ältere SwayFX-Versionen kennen den Befehl nicht –
# darum hängen env-sway.sh und der Installer diese Datei nur an fx.conf an, wenn
# das Sway-Programm „animation_duration_ms“ enthält. 0 schaltet sie ab.
animation_duration_ms 250
